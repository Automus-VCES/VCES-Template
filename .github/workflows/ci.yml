name: Template Validation

on:
  pull_request:
  push:
    branches: [main, "vces/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run validator regression tests
        run: node --test scripts/*.test.mjs
      - name: Validate required files and internal Markdown links
        run: node scripts/validate-template.mjs
      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          mapfile -t workflow_files < <(find .github/workflows templates/workflows -type f \\( -name '*.yml' -o -name '*.yaml' -o -name '*.yml.example' \\) -print)
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file) }; puts "Parsed #{ARGV.length} workflow YAML files."' "${workflow_files[@]}"
