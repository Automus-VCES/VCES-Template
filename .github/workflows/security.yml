name: Workflow Security and Dependency Review

on:
  pull_request:
  push:
    branches: [main, "vces/**"]
  workflow_dispatch:

permissions: {}

jobs:
  workflow-security:
    name: GitHub Actions security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze GitHub Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true

  security-gate:
    name: Security Automation Gate
    needs: workflow-security
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail if workflow security analysis did not pass
        if: ${{ needs.workflow-security.result != 'success' }}
        run: |
          echo "Workflow security analysis did not succeed; blocking the security gate."
          exit 1
      - name: Checkout repository
        if: ${{ needs.workflow-security.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan source, dependencies, secrets, and infrastructure configuration
        if: ${{ needs.workflow-security.result == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          format: table
          version: v0.76.2

  dependency-review:
    name: Dependency vulnerability review (requires GitHub Advanced Security)
    if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
